name: infra-smoke

on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/smoke-test.sh"
      - "Makefile"
      - ".github/workflows/infra-smoke.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "scripts/smoke-test.sh"
      - "Makefile"
      - ".github/workflows/infra-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start brokers and create topics
        run: make up

      - name: Smoke test
        run: make smoke

      - name: Broker logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color

      - name: Tear down
        if: always()
        run: make reset
